# One line per vehicle. node_id must match swarm_config.SWARM; node 0 is the
# leader and is the only one started with --command-interface.
[swarm]
pi0 ansible_host=192.168.3.23  node_id=0
pi1 ansible_host=192.168.3.150 node_id=1

[swarm:vars]
# the Pis' login user
ansible_user=pi
# How the Pixhawk is wired to the Pi: "uart" (TELEM2 -> GPIO14/15) or "usb".
px4_link=uart
mavlink_url={{ 'serial:///dev/ttyAMA0:921600' if px4_link == 'uart' else 'serial:///dev/ttyACM0:57600' }}
bcast_addr=192.168.3.255
